<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wer ist die coolste Sitznachbarin?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        form {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 300px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<h2>Wer ist die coolste Sitznachbarin?</h2>
<form action="#" method="post">
    <label for="name">Name deiner Sitznachbarin:</label>
    <input type="text" id="name" name="name" placeholder="Name eingeben" required>

    <label for="coolness">Coolness-Level:</label>
    <select id="coolness" name="coolness">
        <option value="mega">Mega cool 😎</option>
        <option value="super">Super cool ✨</option>
        <option value="ok">Ganz okay 🙂</option>
    </select>

    <button type="submit">Abschicken</button>
</form>

</body>
</html>
